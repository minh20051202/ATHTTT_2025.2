[project]
name = "agentic-commerce-backend"
version = "0.1.0"
description = "Agentic Commerce Auth Demo — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "websockets==12.0",
    "python-dotenv==1.0.0",
    "httpx==0.25.2",
    "aiosqlite==0.19.0",
    "ecpy",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"